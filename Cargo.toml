[package]
name = "fflogs"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_qs = "0.13"
serde_with = "3.12"
strum = { version = "0.26", features = ["derive"] }
thiserror = { version = "2" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[features]
brotli = ["reqwest/brotli"]
deflate = ["reqwest/deflate"]
gzip = ["reqwest/gzip"]
